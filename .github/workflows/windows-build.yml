name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - devin/windows-build

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS installer
        env:
          VITE_AGENTERO_ACCOUNT_SURFACE: "0"
          NODE_OPTIONS: --max-old-space-size=6144
        # pwsh, not bash: Git Bash's /usr/bin/link shadows MSVC link.exe.
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path "$env:RUNNER_TEMP/ci-nsis.json"
          pnpm tauri build --bundles nsis --config "$env:RUNNER_TEMP/ci-nsis.json"
      - uses: actions/upload-artifact@v4
        with:
          name: agentero-windows-x64-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
